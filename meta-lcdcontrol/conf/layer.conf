# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-lcdcontrol"
BBFILE_PATTERN_meta-lcdcontrol = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-lcdcontrol = "6"

LAYERDEPENDS_meta-lcdcontrol = "core"
LAYERSERIES_COMPAT_meta-lcdcontrol = "scarthgap"
