# IMPORTANT: Always include the base machine configuration first.
# This ensures your custom settings are layered on top of the defaults.
require conf/machine/raspberrypi4-64.conf

# === config.txt settings ===
# Append these lines to the generated config.txt
# enable_uart=1 (enables hardware UART)
RPI_EXTRA_CONFIG:append = "\nenable_uart=1"

# dtoverlay=disable-bt (disables Bluetooth on primary UART, freeing up ttyAMA0)
RPI_EXTRA_CONFIG:append = "\ndtoverlay=disable-bt"

# === cmdline.txt settings ===
# This variable defines the entire content of cmdline.txt.
# Use /dev/mmcblk0p2 as the root device, as it's standard for SD cards
# and has proven to work for your setup.
CMDLINE = "root=/dev/mmcblk0p2 rw rootfstype=ext4 rootwait debug earlyprintk loglevel=7 initcall_debug quiet=0"

# === Other relevant machine features ===
# Ensure the 'uart' feature is explicitly enabled for the machine
# This helps ensure the kernel gets properly configured for UART support.
MACHINE_FEATURES += "uart"

# Explicitly define the init manager if not already globally set
# (Based on your conf/distro/include/init-manager-none.inc, it's sysvinit)
VIRTUAL-RUNTIME_init_manager ??= "sysvinit"
